[package]
name = "licencify"
version = "0.2.0"
edition = "2024"
description = "A CLI tool to add open-source licenses to projects"
license = "MIT"

[[bin]]
name = "licencify"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ignore = "0.4.33"
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tera = "2.4.0"
toml = "1.1.6"
toml_edit = "0.25.15"
ureq = "3.4.2"
