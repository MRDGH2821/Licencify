---
jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit
  build:
    continue-on-error: false
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Native builds (macOS / Windows / Linux x86_64 GNU): install the matrix target on the runner host.
      # Linux + `cross`: do NOT install the target via rustup; `cross` provides a containerized toolchain.
      - if: matrix.os != 'ubuntu-latest' || matrix.target == 'x86_64-unknown-linux-gnu'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
          toolchain: stable
      - if: matrix.os == 'ubuntu-latest' && matrix.target != 'x86_64-unknown-linux-gnu'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Set artifact base name
        run: |
          echo "ASSET_BASE=licencify-${{ matrix.target }}" >> "$GITHUB_ENV"
          if [[ "${{ matrix.target }}" == *"-windows-"* ]]; then
            echo "BIN_NAME=licencify.exe" >> "$GITHUB_ENV"
            echo "ASSET_FILE=licencify-${{ matrix.target }}.exe" >> "$GITHUB_ENV"
          else
            echo "BIN_NAME=licencify" >> "$GITHUB_ENV"
            echo "ASSET_FILE=licencify-${{ matrix.target }}" >> "$GITHUB_ENV"
          fi
        shell: bash
      - if: matrix.os == 'ubuntu-latest' && matrix.target != 'x86_64-unknown-linux-gnu'
        name: Install Cross (for non-native targets)
        run: cargo install cross --git https://github.com/cross-rs/cross
      # `x86_64-pc-windows-gnullvm` requires the LLVM/MinGW clang driver (`x86_64-w64-mingw32-clang`) on PATH.
      - if: matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-gnullvm'
        name: Install LLVM/MinGW (gnullvm linker)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-llvm
          msystem: MINGW64
          path-type: inherit
          update: true
      - if: matrix.target == 'x86_64-unknown-linux-gnu' || startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'windows')
        name: Build Release Binary (native)
        run: cargo build --release --target ${{ matrix.target }}
      - if: matrix.os == 'ubuntu-latest' && matrix.target != 'x86_64-unknown-linux-gnu'
        name: Build Release Binary (cross)
        run: cross build --release --target ${{ matrix.target }}
      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "artifacts/${ASSET_FILE}"
          if [[ "${BIN_NAME}" != *.exe ]]; then
            chmod +x "artifacts/${ASSET_FILE}"
          fi
        shell: bash
      - name: Create Binary Checksum
        run: |
          cd artifacts
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # certutil exists on Windows runners; Linux/macOS runners should not rely on it.
            certUtil -hashfile "${ASSET_FILE}" SHA256 | grep -v "SHA256 hash" | tr -d ' ' > "${ASSET_FILE}.sha256"
          else
            sha256sum "${ASSET_FILE}" > "${ASSET_FILE}.sha256"
          fi
        shell: bash
      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: ${{ env.ASSET_BASE }}
          path: artifacts/
    strategy:
      matrix:
        include:
          # Linux x86_64 (Tier 1)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux i686 (Tier 1)
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          # Linux ARM64 (Tier 2)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          # Linux x86_64 musl (Tier 2)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Linux ARM64 musl (Tier 2)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          # macOS x86_64 (Tier 1)
          - os: macos-latest
            target: x86_64-apple-darwin
          # macOS ARM64 (Tier 1)
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows x86_64 (Tier 1)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Windows i686 (Tier 1)
          - os: windows-latest
            target: i686-pc-windows-msvc
          # Windows ARM64 (Tier 2)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          # Windows x86_64 GNU — cross Docker image
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
          - os: ubuntu-latest
            target: i686-pc-windows-gnu
          # gnullvm has no cross-rs image; build on Windows (LLVM/MinGW Rust toolchain)
          - os: windows-latest
            target: x86_64-pc-windows-gnullvm
          # FreeBSD x86_64 (Tier 2)
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
          # ---- Additional cross-rs supported targets ----
          # Linux (x86 variants)
          - os: ubuntu-latest
            target: i586-unknown-linux-gnu
          - os: ubuntu-latest
            target: i586-unknown-linux-musl
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
          # Linux (ARM / AArch64)
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabi
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabi
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: armv5te-unknown-linux-gnueabi
          - os: ubuntu-latest
            target: armv5te-unknown-linux-musleabi
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabi
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabi
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: thumbv7neon-unknown-linux-gnueabihf
          # Linux (LoongArch)
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-musl
          # Linux (PowerPC)
          - os: ubuntu-latest
            target: powerpc-unknown-linux-gnu
          - os: ubuntu-latest
            target: powerpc64-unknown-linux-gnu
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
          # Linux (RISC-V / S390x / SPARC)
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
          - os: ubuntu-latest
            target: sparc64-unknown-linux-gnu
          # BSDs / illumos / Solaris (cross std targets)
          - os: ubuntu-latest
            target: i686-unknown-freebsd
          - os: ubuntu-latest
            target: x86_64-unknown-netbsd
          - os: ubuntu-latest
            target: x86_64-unknown-illumos
          - os: ubuntu-latest
            target: sparcv9-sun-solaris
          - os: ubuntu-latest
            target: x86_64-pc-solaris
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download All Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
      - name: Check for Required Builds
        run: |
          # Verify at least one x86_64 build per OS succeeded
          LINUX_X86_64=$(find release-artifacts -name "licencify-x86_64-unknown-linux-gnu*" -type f 2>/dev/null | wc -l)
          MACOS_X86_64=$(find release-artifacts -name "licencify-x86_64-apple-darwin*" -type f 2>/dev/null | wc -l)
          WINDOWS_X86_64=$(find release-artifacts -name "licencify-x86_64-pc-windows-msvc*" -type f 2>/dev/null | wc -l)
          echo "Linux x86_64 artifacts: $LINUX_X86_64"
          echo "macOS x86_64 artifacts: $MACOS_X86_64"
          echo "Windows x86_64 artifacts: $WINDOWS_X86_64"
          if [ "$LINUX_X86_64" -eq 0 ] || [ "$MACOS_X86_64" -eq 0 ] || [ "$WINDOWS_X86_64" -eq 0 ]; then
            echo "ERROR: Missing required x86_64 builds!"
            exit 1
          fi
        shell: bash
      - name: Flatten Artifacts Directory
        run: |
          mkdir -p flat-artifacts
          find release-artifacts -type f -exec cp {} flat-artifacts/ \;
          ls -lah flat-artifacts/
        shell: bash
      - id: changelog
        name: Get Changelog Entry
        run: |
          # Extract changelog for this version from CHANGELOG.md
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -f "CHANGELOG.md" ]; then
            # Get content between this version and next version header
            awk "/^## \[${VERSION}\]/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > changelog_entry.txt
            if [ -s changelog_entry.txt ]; then
              echo "changelog<<EOF" >> $GITHUB_OUTPUT
              cat changelog_entry.txt >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "changelog=Release $VERSION" >> $GITHUB_OUTPUT
            fi
          else
            echo "changelog=Release $VERSION" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          files: flat-artifacts/*
          prerelease: false
  packslip:
    name: Sign release manifest
    needs: create-release
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
      - name: Describe release binaries
        run: |
          set -euo pipefail
          mkdir packslip-binaries
          find release-artifacts -type f -name 'licencify-*' ! -name '*.sha256' \
            -exec cp -t packslip-binaries {} +
          python3 - <<'PY' > packslip-release.toml
          from pathlib import Path
          files = sorted(Path("packslip-binaries").glob("licencify-*"))
          if not files:
              raise SystemExit("No release binaries found")
          print('bin = ["licencify"]')
          for path in files:
              target = path.name.removeprefix("licencify-").removesuffix(".exe")
              arch = target.split("-", 1)[0]
              print(f'\n[[artifact]]\npath = "{path}"\nformat = "raw"')
              if arch in {"i586", "armv5te", "thumbv7neon", "powerpc", "sparc64"}:
                  print('os = "linux"')
                  print(f'arch = "{("armv7" if arch == "thumbv7neon" else arch)}"')
                  print('libc = "musl"' if "-musl" in target else 'libc = "gnu"')
              if target.endswith("-solaris"):
                  print('os = "solaris"')
                  print(f'arch = "{arch}"')
              variant = (
                  "neon" if arch == "thumbv7neon" else
                  "hardfloat" if target.endswith(("gnueabihf", "musleabihf")) else
                  "gnu" if target.endswith("-windows-gnu") else
                  "gnullvm" if target.endswith("-windows-gnullvm") else None
              )
              if variant:
                  print(f'variant = "{variant}"')
          PY
        shell: bash
      - id: packslip
        uses: jdx/packslip@b934a22ba187f1d3928441170b9413c5119360bf # v1.11.2
        with:
          artifacts: packslip-binaries/licencify-*
          manifest: packslip-release.toml
          upload: false
      - name: Transfer signed bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
  publish-packslip:
    name: Publish signed manifest
    needs: packslip
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip-bundle
          path: packslip
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Upload signed bundle
        run: |
          test -f packslip/packslip.sigstore.json
          gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
name: Release Binary Builds
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*
permissions:
  contents: write
