[default]
[default.extend-words]
ND = "ND"
ser = "ser"

[files]
# tombi: format.rules.array-values-order = "ascending"
extend-exclude = [
  "**/.mise/**",
  "**/locks/**",
  "*.lock",
  "data/licences.json",
  "data/licenses.json",
  "go.sum",
  "npm-shrinkwrap.json",
  "package-lock.json",
  "pnpm-lock.yaml"
]

# CHANGELOG.md is generated by git-cliff; its commit-hash links (short hash in
# the link text + full 40-char hash in the URL) trip the spell checker.
[type.changelog]
extend-glob = ["CHANGELOG.md"]
extend-ignore-re = ["\\(\\[[0-9a-f]{7,40}\\]\\([^)]*\\)\\)"]
